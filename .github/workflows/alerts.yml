name: XAUUSD alerts

# Một lượt chạy giữ máy ~5h40: nghe WebSocket Binance và quét ngay khi nến 15m đóng (trễ vài giây), thêm một lượt dự phòng mỗi 5 phút; cuối lượt tự gọi lại chính nó (không phụ thuộc cron của GitHub,
# vốn hay trễ hoặc bỏ lượt). Cron mỗi giờ chỉ là lưới an toàn: nếu chuỗi bị đứt thì cron nối lại.
# Cần repo public (không giới hạn phút Actions).
on:
  push:
    # đổi mã của bot thì chạy lại ngay bằng mã mới (lượt đang chạy bị thay thế)
    branches: [main]
    paths: ['.github/workflows/alerts.yml', 'scripts/notify.js', 'scripts/watch.js', 'scripts/chart.js', 'scripts/shot.js', 'scripts/render.html', 'scripts/test-request.txt', 'scripts/message.js', 'scripts/stages.js', 'live/signals.js', 'assets/analyst-models.js', 'assets/engine.js', 'assets/deriv.js', 'assets/coinbase.js', 'assets/analyst-core.js', 'assets/analyst.js', 'assets/style.css']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Gửi tin nhắn thử để kiểm tra kết nối Telegram'
        type: boolean
        default: false
      force:
        description: 'Gửi lại setup hiện có (bỏ qua chống trùng)'
        type: boolean
        default: false

permissions:
  contents: write   # đăng lịch tin lên nhánh data cho trang web
  actions: write

concurrency:
  group: xau-alerts
  # chạy tay có đánh dấu thử / gửi lại cũng thay lượt đang chạy, để có tin ngay thay vì xếp hàng chờ
  cancel-in-progress: ${{ github.event_name == 'push' || inputs.test == true || inputs.force == true }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Khôi phục danh sách đã thông báo
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: xau-state-${{ github.run_id }}
          restore-keys: xau-state-

      - name: Cài công cụ dựng ảnh
        run: |
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null 2>&1 || true
          npm i --no-save --no-audit --no-fund @resvg/resvg-js || echo "::warning::Không cài được resvg, tin nhắn sẽ không kèm ảnh"

      - name: Quét và gửi thông báo
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST: ${{ inputs.test }}
          FORCE: ${{ inputs.force }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MODE: ${{ vars.MODE }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          HB_HOUR: ${{ vars.HB_HOUR }}
          NEWS: ${{ vars.NEWS }}
          SESSIONS: ${{ vars.SESSIONS }}
          STAGES: ${{ vars.STAGES }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          PRICE_OFFSET: ${{ vars.PRICE_OFFSET }}
          SHOT: ${{ vars.SHOT }}
          GOLD_FEED: ${{ vars.GOLD_FEED }}
          BTC_FEED: ${{ vars.BTC_FEED }}
        run: node scripts/watch.js

      - name: Lưu danh sách đã thông báo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: xau-state-${{ github.run_id }}

      - name: Báo lỗi qua Telegram nếu lượt chạy hỏng
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TG_CHAT_ID}"             --data-urlencode "text=🔴 Bot lỗi, cron sẽ tự khởi động lại. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - name: Tự gọi lượt kế tiếp
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alerts.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
