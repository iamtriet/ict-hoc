name: Check

# Kiểm tra tự động mỗi lần có commit: cú pháp mọi file JS + chạy lõi phân tích và kiểm chứng trên dữ liệu mẫu.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.js
      # chỉ để biết máy GitHub có lấy được giá Deriv không (bot có nguồn dự phòng nên không làm hỏng kiểm tra)
      - run: node scripts/probe-deriv.js
        continue-on-error: true
